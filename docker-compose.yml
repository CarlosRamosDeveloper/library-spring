services:
  library_app:
    container_name: library_app
    image: cr_d-library-app:1.0.0
    build: .
    ports: 
      - 8080:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql_db:3306/db_library_spring
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=asd123123
    depends_on:
      - mysql_db
    entrypoint: >
      sh -c "until nc -z mysql_db 3306; do echo 'Waiting for MySQL...'; sleep 2; done;
      java -jar app.jar"
  mysql_db: 
    container_name: mysql_db
    image: mysql:latest
    restart: always
    ports:
      - 3306:3306
    environment:
      - MYSQL_DATABASE=db_library_spring
      - MYSQL_ROOT_PASSWORD=asd123123

